<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Hand-authored source (ADR-0008). Stage 3 network redesign, before/after:
       one flat bridged domain vs routed per-site failure domains on a ring. -->
  <rect x="0" y="0" width="760" height="400" rx="10" fill="#16202c"/>
  <line x1="380" y1="20" x2="380" y2="380" stroke="#2a3a4d" stroke-width="2"/>

  <!-- ============ BEFORE (left) ============ -->
  <text x="24" y="36" fill="#e8704c" font-size="15" font-weight="600">before: one flat network</text>

  <!-- single broadcast domain blob -->
  <rect x="30" y="78" width="320" height="240" rx="12" fill="#e8704c" fill-opacity="0.06" stroke="#e8704c" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="44" y="344" fill="#e8704c" font-size="12">one broadcast domain — every failure,</text>
  <text x="44" y="360" fill="#e8704c" font-size="12">everywhere, all at once</text>

  <rect x="140" y="92" width="100" height="30" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="158" y="112" fill="#d8e1ec" font-size="12">upstream</text>

  <!-- chain: site A -> site B -> site C -->
  <line x1="190" y1="122" x2="190" y2="152" stroke="#8b98a9" stroke-width="1.5"/>
  <rect x="140" y="152" width="100" height="30" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="172" y="172" fill="#d8e1ec" font-size="12">site A</text>

  <!-- failed link -->
  <line x1="190" y1="182" x2="190" y2="216" stroke="#8b98a9" stroke-width="1.5"/>
  <line x1="180" y1="190" x2="200" y2="208" stroke="#e8704c" stroke-width="3"/>
  <line x1="200" y1="190" x2="180" y2="208" stroke="#e8704c" stroke-width="3"/>

  <rect x="140" y="216" width="100" height="30" rx="6" fill="#1f2d3d" stroke="#e8704c" stroke-width="1.5"/>
  <text x="172" y="236" fill="#7a8696" font-size="12">site B</text>
  <line x1="190" y1="246" x2="190" y2="276" stroke="#5a6b80" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="140" y="276" width="100" height="30" rx="6" fill="#1f2d3d" stroke="#e8704c" stroke-width="1.5"/>
  <text x="172" y="296" fill="#7a8696" font-size="12">site C</text>

  <text x="252" y="236" fill="#e8704c" font-size="12">one cut link:</text>
  <text x="252" y="252" fill="#e8704c" font-size="12">B and C dark,</text>
  <text x="252" y="268" fill="#e8704c" font-size="12">drive now</text>

  <!-- ============ AFTER (right) ============ -->
  <text x="404" y="36" fill="#54b46c" font-size="15" font-weight="600">after: routed failure domains</text>

  <rect x="520" y="78" width="100" height="30" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="538" y="98" fill="#d8e1ec" font-size="12">upstream</text>
  <line x1="570" y1="108" x2="570" y2="134" stroke="#8b98a9" stroke-width="1.5"/>
  <rect x="520" y="134" width="100" height="30" rx="6" fill="#1f2d3d" stroke="#4c8dd8" stroke-width="1.5"/>
  <text x="532" y="154" fill="#d8e1ec" font-size="12">core router</text>

  <!-- ring: core -> A -> B -> C -> core -->
  <line x1="535" y1="164" x2="475" y2="208" stroke="#8b98a9" stroke-width="1.5"/>
  <line x1="605" y1="164" x2="665" y2="208" stroke="#8b98a9" stroke-width="1.5"/>
  <line x1="475" y1="238" x2="540" y2="282" stroke="#8b98a9" stroke-width="1.5"/>
  <line x1="665" y1="238" x2="600" y2="282" stroke="#54b46c" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- routed site boxes -->
  <g>
    <rect x="420" y="208" width="110" height="30" rx="6" fill="#1f2d3d" stroke="#54b46c" stroke-width="1.5"/>
    <text x="444" y="228" fill="#d8e1ec" font-size="12">site A · /26</text>
    <rect x="610" y="208" width="110" height="30" rx="6" fill="#1f2d3d" stroke="#54b46c" stroke-width="1.5"/>
    <text x="634" y="228" fill="#d8e1ec" font-size="12">site C · /26</text>
    <rect x="515" y="282" width="110" height="30" rx="6" fill="#1f2d3d" stroke="#54b46c" stroke-width="1.5"/>
    <text x="539" y="302" fill="#d8e1ec" font-size="12">site B · /26</text>
  </g>

  <text x="404" y="344" fill="#54b46c" font-size="12">each site its own routed segment; OSPF reroutes</text>
  <text x="404" y="360" fill="#54b46c" font-size="12">around a cut link — "fix tomorrow," not "drive now"</text>
  <text x="612" y="266" fill="#54b46c" font-size="11">the ring link that</text>
  <text x="612" y="280" fill="#54b46c" font-size="11">changes your nights</text>
</svg>

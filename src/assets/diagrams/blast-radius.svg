<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Hand-authored source (ADR-0008). Blast-radius triage: each outage scope
       maps to one network layer. Overlays match the troubleshooting table. -->
  <rect x="0" y="0" width="760" height="420" rx="10" fill="#16202c"/>
  <text x="24" y="34" fill="#d8e1ec" font-size="16" font-weight="600">How big is the blast radius?</text>

  <!-- everything overlay -->
  <rect x="30" y="52" width="700" height="318" rx="10" fill="none" stroke="#e8704c" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="44" y="74" fill="#e8704c" font-size="12">everyone, everywhere → upstream, core, or your own change</text>

  <!-- upstream + core -->
  <rect x="320" y="86" width="120" height="34" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="345" y="108" fill="#d8e1ec" font-size="13">upstream</text>
  <rect x="320" y="142" width="120" height="34" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="338" y="164" fill="#d8e1ec" font-size="13">core router</text>
  <line x1="380" y1="120" x2="380" y2="142" stroke="#8b98a9" stroke-width="1.5"/>

  <!-- site links -->
  <line x1="350" y1="176" x2="206" y2="216" stroke="#8b98a9" stroke-width="1.5"/>
  <line x1="410" y1="176" x2="556" y2="216" stroke="#8b98a9" stroke-width="1.5"/>

  <!-- one site overlay (Site A) -->
  <rect x="56" y="206" width="304" height="148" rx="10" fill="#54b46c" fill-opacity="0.06" stroke="#54b46c" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="70" y="350" fill="#54b46c" font-size="12">one whole site → power first, then backhaul</text>

  <!-- Site A -->
  <rect x="146" y="216" width="120" height="32" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="186" y="237" fill="#d8e1ec" font-size="13">site A</text>
  <line x1="180" y1="248" x2="136" y2="276" stroke="#8b98a9" stroke-width="1.5"/>
  <line x1="232" y1="248" x2="276" y2="276" stroke="#8b98a9" stroke-width="1.5"/>

  <!-- one sector overlay (AP A1) -->
  <rect x="70" y="270" width="140" height="62" rx="8" fill="#4c8dd8" fill-opacity="0.08" stroke="#4c8dd8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="76" y="262" fill="#4c8dd8" font-size="12">one sector → the AP</text>

  <rect x="92" y="276" width="88" height="26" rx="6" fill="#1f2d3d" stroke="#4c8dd8" stroke-width="1.5"/>
  <text x="110" y="294" fill="#d8e1ec" font-size="12">AP A1</text>
  <rect x="232" y="276" width="88" height="26" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="250" y="294" fill="#d8e1ec" font-size="12">AP A2</text>

  <!-- customers under A1, one highlighted -->
  <circle cx="106" cy="320" r="6" fill="#8b98a9"/>
  <circle cx="136" cy="320" r="6" fill="#e8a33d"/>
  <circle cx="166" cy="320" r="6" fill="#8b98a9"/>
  <circle cx="136" cy="320" r="13" fill="none" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="156" y="345" fill="#e8a33d" font-size="12">one customer →</text>
  <text x="156" y="361" fill="#e8a33d" font-size="12">their WiFi, CPE, cable</text>

  <!-- customers under A2 -->
  <circle cx="258" cy="320" r="6" fill="#8b98a9"/>
  <circle cx="288" cy="320" r="6" fill="#8b98a9"/>
  <line x1="106" y1="302" x2="106" y2="314" stroke="#8b98a9" stroke-width="1"/>
  <line x1="136" y1="302" x2="136" y2="314" stroke="#8b98a9" stroke-width="1"/>
  <line x1="166" y1="302" x2="166" y2="314" stroke="#8b98a9" stroke-width="1"/>
  <line x1="258" y1="302" x2="258" y2="314" stroke="#8b98a9" stroke-width="1"/>
  <line x1="288" y1="302" x2="288" y2="314" stroke="#8b98a9" stroke-width="1"/>

  <!-- Site B -->
  <rect x="496" y="216" width="120" height="32" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="536" y="237" fill="#d8e1ec" font-size="13">site B</text>
  <line x1="556" y1="248" x2="556" y2="276" stroke="#8b98a9" stroke-width="1.5"/>
  <rect x="512" y="276" width="88" height="26" rx="6" fill="#1f2d3d" stroke="#8b98a9" stroke-width="1.5"/>
  <text x="530" y="294" fill="#d8e1ec" font-size="12">AP B1</text>
  <circle cx="540" cy="320" r="6" fill="#8b98a9"/>
  <circle cx="570" cy="320" r="6" fill="#8b98a9"/>
  <line x1="540" y1="302" x2="540" y2="314" stroke="#8b98a9" stroke-width="1"/>
  <line x1="570" y1="302" x2="570" y2="314" stroke="#8b98a9" stroke-width="1"/>

  <text x="24" y="400" fill="#8b98a9" font-size="12">The scope of who's affected names the layer that broke — start every diagnosis here.</text>
</svg>
